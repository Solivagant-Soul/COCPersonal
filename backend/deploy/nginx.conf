# 上游：在 Docker 网络内按**服务名**寻址。写 localhost 是错的 ——
# 容器里的 localhost 是 nginx 自己。
upstream coc_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    # 由 compose 的 SERVER_NAME 环境变量注入（见 deployment.md「PUBLIC_BASE_URL」）。
    # 本文件挂载为 /etc/nginx/templates/*.template，官方镜像启动时做变量替换；
    # 直接挂到 conf.d 的话 ${...} 不会被替换，nginx 起不来。
    server_name ${SERVER_NAME};

    # certbot 的验证目录。**必须在 HTTPS 跳转之前**，
    # 否则首次签发会 404，certbot 一直重试失败。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 小程序只接受 HTTPS，HTTP 一律跳过去
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 投稿图片。默认 1m 太小，会把图片截断成损坏文件。
    client_max_body_size 8m;

    # 反代后 request.client.host 永远是 127.0.0.1。
    # **不透传 X-Forwarded-For 的话，全网共用一个限流桶** ——
    # 一个人刷爆，所有人 429（Task 14 的限流依赖这个头）。
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 探针直连上游，不写访问日志 —— 否则日志被探针刷满，
    # 真出问题时反而找不到有用的行。
    location = /healthz {
        proxy_pass http://coc_api;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://coc_api;
        access_log off;
    }

    location /admin/ {
        proxy_pass http://coc_api;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://coc_api;
        proxy_read_timeout 60s;
    }

    # 用 alias 而不是 root：root 会让 /media/../ 之类的路径穿越生效
    location /media/ {
        alias /data/media/;
        # 目录列举会把投稿图片全公开，必须关掉
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        return 404;
    }
}