# 测试专用 PostgreSQL。端口映射到 5433，避免与本机 5432 冲突。
# 用 tmpfs 而非 volume：测试库每次用完即弃，重启后自动回到干净状态。
services:
  postgres:
    image: postgres:16-alpine
    container_name: coc_test_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    tmpfs:
      - /var/lib/postgresql/data
