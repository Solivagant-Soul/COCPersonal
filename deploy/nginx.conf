# COCPersonal 对外入口（**默认 HTTP-only**）。
#
# 挂载方式：compose 把本文件挂到 /etc/nginx/conf.d/default.conf。
# 本文件**不含** ${...} 形式的环境变量占位符，所以不走官方镜像的 templates/envsubst
# 机制。（nginx 自身的变量写作 $host / $uri 这种形式，不受此影响。）
#
# 这里只做三件事：
#   1. 把 Vue 的构建产物发出去（SPA history 模式交给 index.html）
#   2. 把 /api/、/admin/、/media/、探针路径接到 api 容器
#   3. 透传 X-Forwarded-For —— 后端的限流按 IP 计数，
#      不透传的话 request.client.host 永远是反代地址，全网共用一个桶
#      （一个人刷爆，所有人 429）。

upstream coc_api {
    # 容器里的 localhost 是 nginx 自己，必须写 compose 的服务名
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 默认 1m 太小：投稿图片会被截断成损坏文件
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- SPA ----------------------------------------------------------------
    # history 路由：/players/%23ABC 这类路径磁盘上没有对应文件，
    # 交给 index.html 让 vue-router 去解，否则刷新详情页直接 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 文件名带内容哈希，可以放心长缓存。
    # index.html 刻意**不加**这个头：否则发新版客户端还拿旧壳。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ---- 素材图（Fankit 图标） ----------------------------------------------
    # 文件由 compose 以只读方式从宿主 ./frontend/public/pictures 挂到站点根下的
    # pictures/，**不在镜像里**（见 docker-compose.yml 的 web.volumes）。
    # 文件名不带内容哈希 → 只给 7d、**不用** immutable：换图后要能自然过期。
    # 没有 try_files：文件不存在时由 location / 兜底成 index.html 的 200，
    # 所以排障一律看 Content-Type，别只看状态码。
    location /pictures/ {
        expires 7d;
        access_log off;
    }

    # ---- 后端 API -----------------------------------------------------------
    # 注意 proxy_pass 后面**没有**路径：保留原始 URI（/api/v1/...），
    # 而后端路由就是挂在 /api/v1 下的。
    location /api/ {
        proxy_pass http://coc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- 后台（SQLAdmin） ---------------------------------------------------
    location /admin/ {
        proxy_pass http://coc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 投稿图片：只读 alias ----------------------------------------------
    # 必须用 alias：用 root 会把 /media/../ 拼成路径穿越。
    # autoindex off 是硬要求 —— 目录列举等于把所有人的投稿图片全公开。
    location /media/ {
        alias /data/media/;
        autoindex off;
        access_log off;
        expires 7d;
    }

    # ---- 探针 ---------------------------------------------------------------
    # 容器探针会被高频调用，不打访问日志。
    location = /healthz {
        access_log off;
        proxy_pass http://coc_api;
        proxy_set_header Host $host;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://coc_api;
        proxy_set_header Host $host;
    }
}

# --------------------------------------------------------------------------- #
# HTTPS 开关（预留，现在**不启用**：无域名、无证书）
#
# 拿到域名与证书后：
#   1. compose 的 web 里加端口             - "443:443"
#   2. compose 的 web 里加证书只读挂载      - ./deploy/certs:/etc/nginx/certs:ro
#   3. 把下面这段取消注释，并把上面 80 端口的 server 改成跳转：
#          return 301 https://$host$request_uri;
#   4. 证书续期沿用 backend/deploy/certbot-renew.sh 的思路写一份
#
# 前端与后端代码都不用动 —— 这就是 spec §9 说的「HTTPS 留开关」。
# --------------------------------------------------------------------------- #
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name example.com;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 10m;
#
#     # nginx 不允许跨 server 复用 location，启用时把上面 80 端口那几段
#     # （location / 与 /assets/、/api/、/admin/、/media/、探针）
#     # 原样复制进来即可。
