# COCPersonal 单机部署栈：web（对外 80）+ api（内部 8000）+ postgres。
#
# **只有 web 映射端口**：postgres 与 api 都只挂在 compose 的内部网络上。
# 少一个对外端口就少一处能被直接扫描/攻击的入口 —— 这条与 backend 的
# 部署校验测试（tests/test_deployment_config.py）是同一个规矩。
#
# 首次部署：
#   cp .env.example .env        # 填必填项（POSTGRES_PASSWORD / ADMIN_* / PUBLIC_BASE_URL）
#   docker compose up -d --build
#   docker compose exec api alembic upgrade head                    # 建表
#   docker compose exec api python -m app.cli import-game-data      # 升级数据（2073 行）
#   docker compose exec api python -m app.cli seed-dev-rankings     # 可选：无 token 时的排行演示数据
#
# 详细运维（备份、证书、排障）见 backend/docs/deployment.md。

name: cocpersonal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coc}
      POSTGRES_USER: ${POSTGRES_USER:-coc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coc} -d ${POSTGRES_DB:-coc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 单副本一体：API 与采集调度器同进程（backend/AGENTS.md）。
      # 镜像 CMD 固定 --workers 1，不要为了性能加副本/worker。
      APP_ROLE: ${APP_ROLE:-all}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-coc}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-coc}
      # **留空即开发夹具模式**：不打官方 API，由 backend/app/coc/fixtures/ 的占位数据应答
      # （数据自带 _source/_todo 标记，不要当真实数据）。所以这里用 `:-` 而不是 `:?`，
      # 让「还没有 Token」也能把整站跑起来看。拿到 Token 后填上即可切到真实上游。
      COC_API_TOKEN: ${COC_API_TOKEN:-}
      # 留空走官方域名；填 https://cocproxy.royaleapi.dev/v1 走代理
      # （此时 Supercell key 的 Allowed IP 要填代理的 45.79.218.79，不是服务器 IP）
      COC_BASE_URL: ${COC_BASE_URL:-}
      # 对 Supercell 的令牌桶速率。走共享代理时不要调高。
      COC_RATE_LIMIT: ${COC_RATE_LIMIT:-8}
      COC_TIMEOUT: ${COC_TIMEOUT:-15}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      # 后台只认环境变量（不入库、无 create-admin 命令）
      ADMIN_USERNAME: ${ADMIN_USERNAME:?必须在 .env 里设置 ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?必须在 .env 里设置 ADMIN_PASSWORD}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?必须在 .env 里设置 ADMIN_SECRET_KEY}
      MEDIA_ROOT: /data/media
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?必须在 .env 里设置 PUBLIC_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # 投稿图片：api 需要**可写**，web 只读挂载
      - media:/data/media
    healthcheck:
      # 用 /readyz 而不是 /healthz：后者只证明进程活着，DB 挂了照样 200，
      # 编排器会把流量继续打进来。
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      # **两侧端口都由 deploy/compose.sh 从 PUBLIC_BASE_URL 推导**（见该脚本文件头）：
      # 端口是 URL 的一部分，compose 只支持整值 ${VAR} 插值、没法在 YAML 里解析 URL，
      # 所以由脚本读 .env 的 PUBLIC_BASE_URL → 算出端口 → 导出 WEB_PORT / WEB_CONTAINER_PORT
      # 再调 compose。直接用 `docker compose`（不经脚本）时回落到 80:80 —— 老行为不变。
      #
      # 左侧 = 宿主机侧（对外）；右侧 = 容器内 nginx 的监听端口。
      # 右侧跟着协议走：http→80（明文 server）、https→443（TLS server）。
      # 两侧不一致 = 浏览器 TLS 握手失败，且容器日志里看不出任何异常。
      - "${WEB_PORT:-80}:${WEB_CONTAINER_PORT:-80}"
    volumes:
      # 本文件不含 ${...} 占位符，所以直接挂成生效配置即可（无需 templates 机制）。
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 只读：nginx 永远不需要写媒体目录
      - media:/data/media:ro

volumes:
  pgdata:
  media:
